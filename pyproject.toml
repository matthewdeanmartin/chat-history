[project]
name = "chat-history"
version = "0.1.0"
description = "Chat GPT"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Dima Kuchin", email = "dima@mirable.io" }
]
dependencies = [
    "pillow>=11.3.0; python_version >= '3.14'",
    "tiktoken>=0.12.0; python_version >= '3.14'",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "fastapi>=0.103.1",
    "uvicorn>=0.34.2",
    "markdown>=3.4.4",
    "toml>=0.10.2",
    "openai[embeddings,datalib]==0.28.0",
    "faiss-cpu>=1.7.4",
    "tqdm>=4.66.1",
    "tiktoken",
    "markdown-it-py[plugins]>=3.0.0",
    "pygments>=2.19.1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]
